[package]
name = "velodb"
version = "0.2.0"
edition = "2021"
default-run = "velodb"
description = "VeloDB — macOS Vibrant Native PostgreSQL Workbench built with Rust + GPUI"

[lib]
name = "velodb"
path = "src/lib.rs"

[[bin]]
name = "velodb"
path = "src/main.rs"

[[bin]]
name = "velodb-mcp"
path = "src/bin/velodb_mcp.rs"

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.19" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.19", features = ["font-kit"] }
gpui-component = { version = "0.11.0", features = ["gpui-fast", "tree-sitter-sql"] }
anyhow = "1"
lsp-types = "0.97"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "native-tls-tls"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
async-trait = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
url = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlformat = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "http2"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
